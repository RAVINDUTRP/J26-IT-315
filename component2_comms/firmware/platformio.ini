[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = sandeepmistry/LoRa
build_flags =
  -D LORA_FREQUENCY=868E6
  -D NODE_ID=1
  -D NODE_ROLE=\"sensor\"

; For a relay build, override:
;   -D NODE_ID=2 -D NODE_ROLE=\"relay\"
; For a gateway build:
;   -D NODE_ID=10 -D NODE_ROLE=\"gateway\"
;
; Confirm the legal LoRa frequency for the deployment region and the actual
; Ra-02 wiring before flashing field hardware.
